    <script>
        // 클라이언트 측 비밀번호 (하드코딩)
        const PASSCODE = '242500';
        
        // 체크 상태를 저장하는 인메모리 객체. (새로고침 시 초기화됩니다.)

        // 21가지 주제와 콘텐츠 (업데이트된 내용)
        const topics = [
            {
                title: "7망대(1): 성삼위 하나님",
                content: "<strong>7망대</strong>\n어디서든 하나님과 소통되는 기도의 사람 되도록 7망대가 각인되게 하옵소서.\n\n<strong>성삼위 하나님</strong>\n성삼위 하나님께서 내 안에 역사해 주옵소서. 내 생각, 마음 영혼, 몸 모든 것을 사로잡아 주옵소서.\n\n<strong>성부 하나님</strong>\n성부 하나님이 말씀으로 내 안에 역사해 주옵소서. 하나님의 말씀이 내 안에 잘 박힌 못처럼 박히게 하사 내 생각, 마음, 영혼, 몸에 창조의 역사가 일어나게 해 주옵소서.\n\n<strong>성자 예수님</strong>\n성자 예수님이 구원으로 내 안에 역사해 주옵소서. 나의 과거 문제를 해결하신 영세 전 그리스도, 사탄·재앙·지옥 배경에서 나를 건지신 성육신 그리스도, 나와 함께하시는 부활하신 그리스도, 나의 미래를 책임지시고 배경 되시는 재림 주, 심판 주 그리스도께서 나의 주인이 되어 주옵소서.\n\n<strong>성령 하나님</strong>\n성령 하나님이 능력으로 내 안에 역사해 주옵소서. 지금도 성령께서 내 안에 계시고 나를 인도하시니 감사합니다. 성령께서 나에게 충만하게 역사하사 그리스도가 구체화 되고 하나님의 나라가 임하며 땅끝까지 증인 되게 하옵소서."
            },
            {
                title: "7망대(2): 보좌의 능력",
                content: "<strong>보좌의 능력</strong>\n보좌의 능력이 내 속에 임하게 하옵소서. 하나님 나라, 이루어지게 하옵소서. 시공간 초월과 237의 능력이 내 속에 임하게 하옵소서. 내 생명 속에 이 능력이 임하게 하옵소서. 내 영혼 속에 임하게 하옵소서. 내 삶 속에 임하게 하옵소서. 전무후무한 답을 나에게, 내 학업에, 내현장에, 교회에 주시옵소서.\n\n<strong>3초월 : 보좌, 시공간 초월, 237</strong>\n성삼위 하나님, 나를 보좌 삼으시고 내 속에 살고 계시니 감사합니다. 나, 교회, 현장에 보좌의 능력으로 지금 역사해 주옵소서. 시공간을 초월하여 말씀을 이루는 하늘 군대가 동원되고 흑암이 무너지며 하나님의 나라, 이루어지게 하옵소서. 지금 237 나라에 빛으로 임재하옵소서.\n\n<strong>3생명 : 하나님의 형상, 생기, 에덴의 축복</strong>\n그리스도께서 빛으로 내 생명 속에 오셔서 하나님의 형상을 회복시켜 주시니 감사합니다. 내 영혼 속에 하나님의 생기를 부어 주옵소서. 나의 삶 속에 에덴의 축복이 임하게 하옵소서. 가정과 세상을 살리고 다스리며 정복하는 힘을 나에게 주옵소서.\n\n<strong>3전무후무 : 나, 교회, 업</strong>\n하나님! 나의 업이 오직, 유일성, 재창조로 전문화되도록 능력을 부어 주옵소서. 나의 업을 가지고 제자들을 세울 만큼 제자화의 응답을 주옵소서. 237과 5천 종족을 살리는 세계화의 능력을 주옵소서."
            },
            {
                title: "7망대(3): 3시대 살릴 능력",
                content: "<strong>3시대 살릴 능력</strong>\n하나님이 나의 과거, 현재, 미래 속에 능력으로 역사해 주옵소서.\n\n<strong>나의 3시대 살릴 능력 : 과거, 오늘, 미래</strong>\n나의 과거는 완전히 발판이 되게 하옵소서. 오늘 나의 문제는 간증 거리로 바뀌게 하옵소서. 오늘의 문제 속에 답을, 갈등 속에 갱신의 축복을, 위기 속에 기회를 찾게 하옵소서. 나의 미래는 미리 하나님의 응답과 길을 보고 가게 하옵소서.\n\n<strong>업의 3시대 살릴 능력 : 전문화, 제자화, 세계화</strong>\n하나님! 나의 업이 오직, 유일성, 재창조로 전문화되도록 능력을 부어 주옵소서. 나의 업을 가지고 제자들을 세울 만큼 제자화의 응답을 주옵소서. 237과 5천 종족을 살리는 세계화의 능력을 주옵소서.\n\n<strong>교회의 3시대 살릴 능력 : 목회자, 중직자, 렘넌트와 부교역자</strong>\n목회자 도울 능력을 내게 주셔서 교회가 살아나게 하옵소서. 중직자 살릴 능력을 내게 주셔서 현장이 살아나게 하옵소서. 렘넌트와 부교역자 살릴 능력을 내게 주셔서 세계와 미래가 살아나게 하옵소서."
            },
            {
                title: "7망대(4) : 5력",
                content: "<strong>5력</strong>\n이 시간에 하나님이 나에게 5력을 주시옵소서.\n\n<strong>영력</strong>\n세상 사람들이 알 수 없는 눈에 안 보이는 영적임 힘을 내게 주옵소서.\n\n<strong>지력</strong>\n하나님이 주시는 사람 살리는 지력을 내게 주옵소서.\n\n<strong>체력</strong>\n하나님의 일을 할 수 있고 불신자 앞에서 간증할 수 있을 정도의 체력을 내게 주옵소서.\n\n<strong>경제력</strong>\n전 세계에 RUTC세울 수 있도록 빛의 경제 회복하는 경제력을 내게 주시옵소서. \n\n<strong>인력</strong>\n237나라, 5천 종족 살릴 1천만 제자 움직이는 인력을 내게 주옵소서."
            },
            {
                title: "7망대(5): 우주의 능력",
                content: "<strong>우주의 능력</strong>\n나에게 시공간 초월하는, 공중 권세 잡은 자 이기는 능력을 주옵소서.\n\n흑암 세계, 공중 권세 잡은 자를 꺾을 수 있는 예수 그리스도의 이름을 주시니 감사합니다. 공중 권세 잡은 자를 이길 수 있는 우주의 능력이 지금 내 속에 임하게 하옵소서. Heavely Power, Thronely Power, Eternaly Power로 충만케 하옵소서."
            },
            {
                title: "7망대(6): 미리 CVDIP",
                content: "<strong>미리 CVDIP</strong>\n나에게 미리 보는 CVDIP 축복을 지금 허락해 주옵소서.\n\n<strong>C : 절대주권 - Covenant(24) - 미리 보기</strong>\n하나님, 하나님의 절대 주권을 믿는 믿음을 주셔서 그 속에서 언약 붙잡게 하옵소서. 그 언약이 24 내 속에 망대로 서게 하셔서 응답을 미리 보고 가게 하옵소서.\n\n<strong>V : 절대 계획 - Vision(25) - 미리 갖기</strong>\n하나님, 재앙 지대를 보고 하나님의 절대 계획을 질문하다가 답을 찾게 하옵소서. 이 하나님이 주신 비전으로 25망대가 서게 하셔서 응답을 미리 가지고 가게 하옵소서.\n\n<strong>D : 절대 언약 - Dream(OO) - 미리 누림</strong>\n하나님이 주신 꿈인 세계복음화가 절대 언약이 되어 영원이라는 망대로 내게 세워지게 하옵소서. 그래서 미리 누리게 하옵소서.\n\n<strong>I : 절대 여정 - Image(능력) - 미리 정복</strong>\n하나님이 주신 창조의 영, 그 힘으로 절대 여정을 가게 하옵소서. 그래서 하나님이 주신 권세인 이미지의 망대로 공중 권세 잡은 자를 꺾고 미리 정복하게 하옵소서.\n\n<strong>P : 절대 목표 - Practice(보좌) - 미리 성취</strong>\n하나님의 절대 목표인 보좌의 능력으로 시대 살릴 작품을 만들게 하사 미리 성취를 누리게 하옵소서."
            },
            {
                title: "7망대(7): 세 가지 뜰",
                content: "<strong> 세 가지 뜰</strong>\n세 가지 뜰, 그 능력이 임하게 하옵소서.\n\n<strong>이방인의 뜰</strong>\n하나님, 확실한 성령의 인도부터 받길 원합니다. 그래서 오늘이 인생 전환점이 되게 하옵소서. 마가 다락방의 그 능력부터 체험하여 세계복음화의 결론을 보게 하옵소서. 그래서 내 안에, 내 업에, 교회와 현장에 이방인의 뜰이 서게 하옵소서. \n\n<strong>치유의 뜰</strong>\n내 안에, 그리고 교회와 내 업의 현장에 치유의 뜰, 기도의 뜰이 서게 하옵소서. 그래서 오직 예수 그리스도 그 이름으로 아무도 고칠 수 없는 병을 고치게 하옵소서.\n\n<strong>아이들의 뜰</strong>\n내 안에, 내 업과 교회와 현장에 아이들의 뜰이 서게 하옵소서. 아이들에게 그리스도의 당위성, 예배와 기도의 비밀, 하나님 나라가 진짜 응답임을 전달하게 하옵소서. 237, 치유, 서밋이 되게 하옵소서."
            },
            {
                title: "7여정(1): 성삼위 하나님의 인도",
                content: "<strong>여정</strong>\n하나님의 계획을 어디서든 발견하여 7여정이 뿌리내리게 하소서.\n\n<strong>성삼위 하나님의 인도</strong>\n내 안에 영으로 임하셔서 성삼위 하나님이 인도하시는 길로 가게 하옵소서.\n\n우리의 여정이 성부 하나님의 말씀 성취와 그리스도의 구원의 역사와 성령의 능력 속에 있게 하옵소서. 성삼위 하나님의 시간표 속에 있게 하셔서 영세 전에 감추어 둔 것과 지금 아니면 안되는 것과 영원히 있을 것에 쓰임 받게 하옵소서."
            },
            {
                title: "7여정(2): 10가지 비밀",
                content: "<strong>10가지 비밀</strong>\n나에게는 어려움이 너무 많습니다. 하나님이 준비해 놓은 그 길 찾기 위해 10가지 비밀 누리게 하옵소서. 그래서 무엇이든지 응답으로 바꾸는 여정을 가게 하옵소서.\n\n<strong>영적 독립</strong>\n기도로 성삼위 하나님과 보좌의 능력과 세계 살릴 힘을 얻게 하셔서 어떤 경우에도 혼자 살아남는 길을 가게 하옵소서.\n\n<strong>영적 사실</strong>\n세상 나라, 사탄의 나라, 하나님 나라를 알고 현실과 사실과 진실 속에서 다른 사람이 못 보는 영적 사실을 보게 하옵소서.\n\n<strong>반대편</strong>\n사람이 생각지도 않은 반대편에 하나님의 숨은 응답이 있음을 알고 나의 기준, 수준, 표준을 넘어 하나님의 것에 집중하게 하옵소서.\n\n<strong>시너지</strong>\nWith, Immanuel, Oneness를 가지고 가는 곳마다 많은 사람을 살리는 시너지가 일어나게 하옵소서.\n\n<strong>위기</strong>\n성삼위 하나님의 능력 아는 자는 위기 속으로 들어갑니다. 보좌화 된 사람은 위기 속에 있는 축복을 봅니다. 성령 충만한 사람은 위기 속에서 사람 살리는 길을 찾습니다. 위기 속에 들어가서 하나님의 절대 계획을 찾아내 이기게 하옵소서.\n\n<strong>무경쟁</strong>\n하나님의 자녀 된 신분과 권세와 그 배경으로 영적인 힘과 참 응답을 받아 싸우지 않고 이기는 길을 가게 하옵소서.\n\n<strong>재창조</strong>\n어딜 가든지 숨겨져 있는 오직, 유일성, 재창조를 찾아내어 가장 필요한 것을 하는 사람으로 서게 하옵소서.\n\n<strong>서밋</strong>\n영적 서밋, 기능 서밋, 문화 서밋의 자리에 올라 환경과 현장을 살리고, 시대를 앞서가는 응답을 받게 하옵소서.\n\n<strong>Nobody, Nothing</strong>\n아무도 도와주지 않는 Nobody에서 모든 사람 살리는 Everybody로, 아무것도 없는 Nothing에서 모든 것을 살리는 Everything으로 가는 나의 길 되게 하옵서서.\n\n<strong>절대 응답</strong>\n어디서든지 절대 계획과 절대 이유를 찾아내어 절대 응답을 누리는 성공자가 되게 하옵소서."
            },
            {
                title: "7여정(3): 10가지 발판",
                content: "<strong>10가지 발판</strong>\n사람들은 듣는 대로 말하고, 생각대로 말하고, 추측대로 말합니다. 보태서 말합니다. 하나님! 나에게 10가지 발판이 놓이게 하옵소서.\n\n<strong>하나님의 절대주권</strong>\n성삼위 하나님은 지금도 절대 주권 속에서 말씀 성취, 기도 응답, 구원 사역을 하고 계십니다. 이 하나님의 절대 주권을 믿게 하셔서 우리의 모든 불신앙이 치유되게 하옵소서.\n\n<strong>하나님의 방법</strong>\n하나님은 모든 방법을 그리스도 하나로 통일시키셨습니다. 이 그리스도를 오로지 발판 삼게 하셔서 우리의 모든 영적 문제가 치유되며, 전도의 열매가 나타나 세계를 정복하게 하옵소서.\n\n<strong>하나님의 능력</strong>\n성경에 가장 중요한 약속인 보혜사 성령께서 함께하심과 역사하심을 믿고 시공간 초월하는 기도의 힘을 가지게 하옵소서. 성령의 능력과 그 역사를 발판 삼아 무기력과 무능력과 무응답을 치유하고, 세상을 이기게 하옵소서.\n\n<strong>하나님의 말씀</strong>\n영원한 말씀을 우리가 발판 삼게 하옵소서. 말씀에 뿌리내리지 못하므로 하나님과 방향이 자꾸 틀려서 어려움을 당하지 않게 하옵소서. 말씀의 흐름이 잘 박힌 못과 같이 우리 안에 새겨져 일평생 하나님의 영광을 보게 하시고, 모든 사탄의 망대가 무너지는 것을 보게 하옵소서.\n\n<strong>하나님의 성전</strong>\n내가 하나님의 성전임을 알고 내 안에 임한 보좌를 발판 삼게 하옵소서. 세상 성공의 방법이 되는 하나님 자녀의 신분과 권세, 배경을 누려 복음이 지속되는 축복을 누리게 하옵소서.\n\n<strong>하나님의 선교지</strong>\n나 자신과 가정, 나의 일터, 우리가 가는 모든 현장이 전부 하나님의 선교지라는 사실을 알고 오늘도 전도에 성공하게 하옵소서.\n\n<strong>하나님의 통치</strong>\n하나님께서 우리의 생사화복을 주관하시고 통치하심을 믿게 하옵소서. 그리하여 우리의 불신앙과 조급함이 없어지게 하옵소서. 좁은 시야를 가지고 다투는 과거 습관이 사라지게 하옵소서.\n\n<strong>하나님의 섭리</strong>\n모든 사람은 시한부 인생임을 알고 겸손하게 하옵소서. 오늘을 최고 작품으로 만들게 하옵소서. 개인 종말, 시대 종말, 지구 종말을 보고 남은 자, 순례자, 정복자의 길을 가게 하옵소서.\n\n<strong>하나님의 심판</strong>\n천국과 지옥이 있음을 알고 영원한 것에 우리 인생을 투자하게 하옵소서. 천국 배경을 사실화시켜 가는 곳마다 하나님 나라의 일이 일어나 지옥 배경을 막는 자 되게 하옵소서.\n\n<strong>하나님의 상급</strong>\n전도자는 냉수 한 그릇도 상을 잃지 않는다고 약속하셨습니다. 237, 5천 종족을 두고 참 전도(선교)운동하게 하옵소서. 세 가지 뜰과 금토일 시대를 열게 하옵소서. 빛의 경제가 오게 하옵소서."
            },
            {
                title: "7여정(4): 5가지 확신",
                content: "<strong>5가지 확신</strong>\n어떤 어려움도 복음을 이길 수 없습니다. 다섯 가지 확신을 응답으로 누리게 하옵소서.\n\n<strong>구원의 확신</strong>\n그리스도를 통해 구원의 길을 여신 하나님께 감사드립니다. 날마다 구원의 확신을 가지고 나의 과거, 현재, 미래 문제를 해결하신 그리스도의 은혜와 내 안에 임한 보좌를 누리게 하옵소서. 구원에 대한 감격이 날마다 넘쳐나 흑암이 떠나가는 것을 보게 하옵소서.\n\n<strong>동행의 확신</strong>\n부활하신 그리스도께서 우리와 함께하고 계심에 감사드립니다. With의 확신이 있어 내가 어디에 있어도 상관없게 하옵소서. Immanuel의 확신이 있어 누구를 만나도 살리는 자가 되게 하옵소서. Oneness의 확신이 있어 어떤 일을 만나도 미리 응답을 보는 길을 가게 하옵소서.\n\n<strong>승리의 확신</strong>\n구원받은 자는 이미 승리하였습니다. 이제 언약 붙잡고 '절대'라는 길을 보게 하옵소서. 절대 주권임을 미리 보고 절대 계획을 찾게 하옵소서. 이 속에서 절대 언약 붙잡게 하셔서 절대 여정 가게 하옵소서. 하나님이 미리 내게 성취한 절대 목표를 보고 흔들리지 않게 하옵소서."
            },
            {
                title: "7여정(5): 9가지 흐름",
                content: "<strong>9가지 흐름</strong>\n\n하나님의 능력으로 아홉 가지 흐름 누리게 하옵소서. 모든 곳에서 근본을 바꿔 눈에 안보이는 시스템을 조용히 바꾸게 하옵소서.\n\n<strong>하나님과의 소통 : 넓이, 높이, 깊이</strong>\n\n<strong>넓이</strong>\n아무도 모르는 하나님과의 영적 소통으로\n시공간 초월하는 넓이를 갖게 하옵소서.\n시공간 초월하는 응답으로\n모든 현장의 근원적 흐름을 바꾸는\n응답을 보게 하옵소서.\n\n<strong>높이</strong>\n하나님과의 영적 소통을 통해\n저희로 상식 이상의 것을 보게 하옵소서.\n지극히 선한 하나님의 것을\n분별하게 하셔서\n영적 사실과 하나님의 뜻을\n보게 하옵소서.\n모든 흐름을 바꾸는\n응답이 오게 하옵소서.\n\n<strong>깊이</strong>\n모든 것에서\n하나님의 절대 계획을 보게 하옵소서.\n그래서 하나님의 절대 시간표 속으로\n들어가 다른 사람을 살리는 증인이\n되게 하옵소서.\n\n<strong>사람과의 소통 : 위, 옆, 아래</strong>\n\n우리는 내게 들어온 것을 기준으로\n모든 것을 봅니다.\n그 이상의 것을 못 볼 때가 많습니다.\n우리의 많은 길에\n하나님의 중요한 계획을 두고\n축복하고 계시는\n하나님의 선입견을 가지고\n모든 일과 모든 사람을 보게 하옵소서.\n\n<strong>윗 사람</strong>\n나 중심, 세상 중심으로\n사람을 보는 것이 아니라\n위에서 우리를 축복하시는\n하나님의 비밀 속에서\n사람을 보게 하옵소서.\n하나님께서\n목회자, 교역자, 중직자를 세워\n하나님 말씀을 성취시키심을 알고\n그 귀중함을 깨달아 기도하게 하옵소서.\n오직 강단을 통해 목회자, 중직자와\n소통되는 축복을 누리게 하옵소서.\n\n<strong>옆사람</strong>\n먼저 내 안에\n하나님의 성령이 계심을 알고\n나의 가치부터 알게 하옵소서.\n그래서 옆사람의 가치를 알고\n그 사람을 향한 하나님의 계획을\n발견하게 하옵소서.\n모든 만남을 축복으로 누리고,\n또 축복으로 만들게 하옵소서.\n\n<strong>아래 사람 (아래)</strong>\n후대들을 바르게 세우는 것에\n생을 건 헌신을 하게 하옵소서.\n금토일 시대를 열어\n복음과 기도의 능력을 심어주며,\n달란트와 전문성과 현장성을 갖추도록\n심부름하게 하옵소서.\n\n<strong>3. 과거, 현재, 미래와의 소통</strong>\n\n영세 전부터 우리를 향한\n절대 계획을 가지시고\n영원까지 성취시키는 그 일을\n지금 나타내시는 하나님의 시간표 속에\n우리의 과거, 오늘, 미래가 있게 하시니\n감사합니다.\n\n<strong>과거</strong>\n우리의 길에\n하나님의 중요한 계획을 두고\n축복하시는 하나님의 시간표를 가지고\n우리의 모든 과거를 보게 하셔서\n나 중심으로 생각하는\n창 3장, 6장, 11장에서 해방되게 하옵소서.\n오히려 가문과 내 개인의 모든 상처가\n전부 발판이 되어\n축복받기를 원하시는 하나님의 은혜를\n만나게 하옵소서.\n\n<strong>현재</strong>\n우리의 오늘은 문제도 많고 갈등도 많고\n위기도 있습니다.\n문제는 답을 찾게 하는\n하나님의 계획이요,\n갈등은 나를 한 단계 끌어올리시려는\n하나님의 갱신의 축복이요,\n위기는 정말 기회를 주시는\n하나님의 놀라운 축복임을 알게 하옵소서.\n\n<strong>미래</strong>\n하나님은 우리에게\n보좌의 축복을 예비해 놓으셨습니다.\n보좌의 축복을 누리게 하옵소서.\n그리하여 하나님 나라가 임하고,\n하나님 나라의 일이 이뤄지는 것이\n우리의 미래가 되게 하옵소서."
            },

        /**
         * 주제 목록을 동적으로 생성하고 이벤트 리스너를 추가합니다.
         */
        function renderTopicList() {
            const topicListContainer = document.getElementById('topic-list');
            topicListContainer.innerHTML = ''; // 목록 초기화
            
            topics.forEach((topic, index) => {
                const isChecked = checkedStatus[index] === true;
                const button = document.createElement('button');
                
                let classes = [
                    'topic-button', 'w-full', 'text-left', 'px-3', 'py-2', 'rounded-lg', 
                    'transition-all', 'duration-200', 'font-medium', 'text-gray-700', 
                    'hover:bg-gray-200', 'focus:outline-none', 'focus:ring-2', 'focus:ring-primary-blue/50'
                ];

                if (isChecked) {
                    classes.push('bg-checked-gray', 'text-primary-blue'); 
                } else {
                    classes.push('bg-transparent', 'text-gray-700');
                }
                
                button.classList.add(...classes);
                button.setAttribute('data-index', index);
                
                // 체크 아이콘 (SVG)
                const checkIcon = isChecked 
                    ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-primary-blue mr-3 flex-shrink-0"><path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.532-1.258-1.258a.75.75 0 1 0-1.06 1.06l1.75 1.75a.75.75 0 0 0 1.137-.089l4-5.625Z" clip-rule="evenodd" /></svg>`
                    : `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-gray-400 mr-3 flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>`;
                
                button.innerHTML = checkIcon + `<span class="truncate">${topic.title}</span>`;
                
                // 클릭 시 내용 표시 및 체크 상태 토글
                button.addEventListener('click', () => selectTopic(index));
                topicListContainer.appendChild(button);
            });
        }

        /**
         * 특정 주제를 선택하고 콘텐츠 영역을 업데이트하며, 체크 상태를 토글합니다.
         * 체크 해제 시에는 내용을 숨기는 대신, 마지막으로 표시된 내용을 유지합니다.
         * @param {number} index - 선택된 주제의 인덱스
         */
        function selectTopic(index) {
            if (index < 0 || index >= topics.length) return;

            const topic = topics[index];
            const contentDisplay = document.getElementById('content-display');

            // 1. 다음 상태 결정: 현재 체크 상태의 반대가 다음 상태가 됨
            const wasChecked = checkedStatus[index] === true;
            const willBeChecked = !wasChecked; // true -> false, false -> true

            // 2. 체크 상태 토글
            checkedStatus[index] = willBeChecked;
            
            // 3. UI 업데이트 (버튼 색상/아이콘)
            renderTopicList();

            // 4. 콘텐츠 표시 조건: willBeChecked가 true일 때만 콘텐츠를 업데이트합니다.
            //    체크를 해제(willBeChecked: false)하는 경우, 콘텐츠는 이전 상태 그대로 유지됩니다.
            if (willBeChecked) {
                // 체크하는 경우: 새로운 콘텐츠 표시
                // \n (실제 줄바꿈 문자)을 HTML 줄 바꿈(<br>)으로 변환하여 콘텐츠 영역에 표시
                const formattedContent = topic.content.replace(/\n/g, '<br>');

                contentDisplay.innerHTML = `
                    <h2 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-3" id="content-title">
                        ${topic.title}
                    </h2>
                    <div class="text-gray-700 leading-relaxed text-lg bg-secondary-gray p-6 rounded-xl shadow-inner">
                        <p class="mb-4 font-semibold text-primary-blue">기도 내용:</p>
                        <p>${formattedContent}</p>
                    </div>
                `;
            } 
            // else (willBeChecked가 false인 경우 - 체크 해제): 
            // contentDisplay.innerHTML을 변경하지 않으므로, 마지막에 표시된 내용이 유지됩니다.
        }

        /**
         * 로그인 처리 함수 (클라이언트 측 비밀번호 검증)
         */
        function handleLogin() {
            const passwordInput = document.getElementById('password-input');
            const errorMessage = document.getElementById('error-message');
            const enteredPassword = passwordInput.value.trim();

            if (enteredPassword === PASSCODE) {
                // 성공: 로그인 화면 숨기고 메인 콘텐츠 표시
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                errorMessage.classList.add('hidden');
                renderTopicList(); // 로그인 후 목록 렌더링 시작
            } else {
                // 실패: 에러 메시지 표시 및 입력 필드 초기화
                errorMessage.textContent = '비밀번호가 올바르지 않습니다.';
                errorMessage.classList.remove('hidden');
                passwordInput.value = ''; 
                passwordInput.focus();
            }
        }


        // 페이지 로드 시 이벤트 리스너 설정
        window.onload = function() {
            const loginButton = document.getElementById('login-button');
            const passwordInput = document.getElementById('password-input');

            // '접속' 버튼 클릭 이벤트 리스너
            if (loginButton) {
                loginButton.addEventListener('click', handleLogin);
            }

            // Enter 키 입력 이벤트 리스너
            if (passwordInput) {
                passwordInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        handleLogin();
                    }
                });
                passwordInput.focus(); // 페이지 로드 시 입력 필드에 포커스
            }
        };

    </script>
</body>
</html>
