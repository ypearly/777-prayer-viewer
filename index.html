        // ******************************************************
        // ** 보안 설정: 암호 설정은 이 변수를 수정하세요 **
        // ******************************************************
        const SECRET_PASSWORD = "242500"; 
        
        // Firebase 및 사용자 상태 전역 변수

        let checkedStatus = {}; // { '0': true, '1': false, ... }
        
        const COLLECTION_NAME = 'prayer_checks';
        const DOCUMENT_ID = 'user_status';

        // 21가지 주제와 콘텐츠를 저장하는 객체 (주제 7번부터는 더미 데이터 대신 7여정, 7이정표로 업데이트 했습니다.)
        const topics = [
            {
                title: "7망대(1): 성삼위 하나님",
                content: "<strong>7망대</strong>\n어디서든 하나님과 소통되는 기도의 사람 되도록 7망대가 각인되게 하옵소서.\n\n<strong>성삼위 하나님</strong>\n성삼위 하나님께서 내 안에 역사해 주옵소서. 내 생각, 마음 영혼, 몸 모든 것을 사로잡아 주옵소서.\n\n<strong>성부 하나님</strong>\n성부 하나님이 말씀으로 내 안에 역사해 주옵소서. 하나님의 말씀이 내 안에 잘 박힌 못처럼 박히게 하사 내 생각, 마음, 영혼, 몸에 창조의 역사가 일어나게 해 주옵소서.\n\n<strong>성자 예수님</strong>\n성자 예수님이 구원으로 내 안에 역사해 주옵소서. 나의 과거 문제를 해결하신 영세 전 그리스도, 사탄·재앙·지옥 배경에서 나를 건지신 성육신 그리스도, 나와 함께하시는 부활하신 그리스도, 나의 미래를 책임지시고 배경 되시는 재림 주, 심판 주 그리스도께서 나의 주인이 되어 주옵소서.\n\n<strong>성령 하나님</strong>\n성령 하나님이 능력으로 내 안에 역사해 주옵소서. 지금도 성령께서 내 안에 계시고 나를 인도하시니 감사합니다. 성령께서 나에게 충만하게 역사하사 그리스도가 구체화 되고 하나님의 나라가 임하며 땅끝까지 증인 되게 하옵소서."
            },
            {
                title: "7망대(2): 보좌의 능력",
                content: "<strong>보좌의 능력</strong>\n보좌의 능력이 내 속에 임하게 하옵소서. 하나님 나라, 이루어지게 하옵소서. 시공간 초월과 237의 능력이 내 속에 임하게 하옵소서. 내 생명 속에 이 능력이 임하게 하옵소서. 내 영혼 속에 임하게 하옵소서. 내 삶 속에 임하게 하옵소서. 전무후무한 답을 나에게, 내 학업에, 내현장에, 교회에 주시옵소서.\n\n<strong>3초월 : 보좌, 시공간 초월, 237</strong>\n성삼위 하나님, 나를 보좌 삼으시고 내 속에 살고 계시니 감사합니다. 나, 교회, 현장에 보좌의 능력으로 지금 역사해 주옵소서. 시공간을 초월하여 말씀을 이루는 하늘 군대가 동원되고 흑암이 무너지며 하나님의 나라, 이루어지게 하옵소서. 지금 237 나라에 빛으로 임재하옵소서.\n\n<strong>3생명 : 하나님의 형상, 생기, 에덴의 축복</strong>\n그리스도께서 빛으로 내 생명 속에 오셔서 하나님의 형상을 회복시켜 주시니 감사합니다. 내 영혼 속에 하나님의 생기를 부어 주옵소서. 나의 삶 속에 에덴의 축복이 임하게 하옵소서. 가정과 세상을 살리고 다스리며 정복하는 힘을 나에게 주옵소서.\n\n<strong>3전무후무 : 나, 교회, 업</strong>\n나를 전무후무한 존재로 만드시고, 나에게 전무후무한 계획을 준비해 놓으신 하나님께 감사드립니다. 하나님이 나에게만 주신 전무후후한 응답을 누리게 하옵소서. 교회에서 만나는 사람들과 일 속에서 전무후무한 응답을 보게 하옵소서. 내가 꼭 해야 되는 일, 이면계약이 보이게 하옵소서. 하나님이 만드신 나, 나의 것, 나의 현장을 찾게 하셔서 오직, 유일성, 재창조의 응답을 받게 하옵소서. 나의 업이 사람 살리는 플랫폼, 파수 망대, 안테나가 되게 하옵소서."
            },
            {
                title: "7망대(3): 3시대 살릴 능력",
                content: "<strong>3시대 살릴 능력</strong>\n하나님이 나의 과거, 현재, 미래 속에 능력으로 역사해 주옵소서.\n\n<strong>나의 3시대 살릴 능력 : 과거, 오늘, 미래</strong>\n나의 과거는 완전히 발판이 되게 하옵소서. 오늘 나의 문제는 간증 거리로 바뀌게 하옵소서. 오늘의 문제 속에 답을, 갈등 속에 갱신의 축복을, 위기 속에 기회를 찾게 하옵소서. 나의 미래는 미리 하나님의 응답과 길을 보고 가게 하옵소서.\n\n<strong>업의 3시대 살릴 능력 : 전문화, 제자화, 세계화</strong>\n하나님! 나의 업이 오직, 유일성, 재창조로 전문화되도록 능력을 부어 주옵소서. 나의 업을 가지고 제자들을 세울 만틈 제자화의 응답을 주옵소서. 237과 5천 종족을 살리는 세계화의 능력을 주옵소서.\n\n<strong>교회의 3시대 살릴 능력 : 목회자, 중직자, 렘넌트와 부교역자</strong>\n목회자 도울 능력을 내게 주셔서 교회가 살아나게 하옵소서. 중직자 살릴 능력을 내게 주셔서 현장이 살아나게 하옵소서. 렘넌트와 부교역자 살릴 능력을 내게 주셔서 세계와 미래가 살아나게 하옵소서."
            },
            {
                title: "7망대(4) : 5력",
                content: "<strong>5력</strong>\n이 시간에 하나님이 나에게 5력을 주시옵소서\n\n<strong>영력</strong>\n세상 사람들이 알 수 없는 눈에 안 보이는 영적임 힘을 내게 주옵소서.\n\n<strong>지력</strong>\n하나님이 주시는 사람 살리는 지력을 내게 주옵소서.\n\n<strong>체력</strong>\n하나님의 일을 할 수 있고 불신자 앞에서 간증할 수 있을 정도의 체력을 내게 주옵소서.\n\n<strong>경제력</strong>\n전 세계에 RUTC세울 수 있도록 빛의 경제 회복하는 경제력을 내게 주시옵소서. \n\n<strong>인력</strong>\n237나라, 5천 종족 살릴 1천만 제자 움직이는 인력을 내게 주옵소서."
            },
            {
                title: "7망대(5): 우주의 능력",
                content: "<strong>우주의 능력</strong>\n나에게 시공간 초월하는, 공중 권세 잡은 자 이기는 능력을 주옵소서.\n\n흑암 세계, 공중 권세 잡은 자를 꺾을 수 있는 예수 그리스도의 이름을 주시니 감사합니다. 공중 권세 잡은 자를 이길 수 있는 우주의 능력이 지금 내 속에 임하게 하옵소서. Heavely Power, Thronely Power, Eternaly Power로 충만케 하옵소서."
            },
            {
                title: "7망대(6): 미리 CVDIP",
                content: "<strong>미리 CVDIP</strong>\n나에게 미리 보는 CVDIP 축복을 지금 허락해 주옵소서.\n\n<strong>C : 절대주권 - Covenant(24) - 미리 보기</strong>\n하나님, 하나님의 절대 주권을 믿는 믿음을 주셔서 그 속에서 언약 붙잡게 하옵소서. 그 언약이 24 내 속에 망대로 서게 하셔서 응답을 미리 보고 가게 하옵소서.\n\n<strong>V : 절대 계획 - Vision(25) - 미리 갖기</strong>\n하나님, 재앙 지대를 보고 하나님의 절대 계획을 질문하다가 답을 찾게 하옵소서. 이 하나님이 주신 비전으로 25망대가 서게 하셔서 응답을 미리 가지고 가게 하옵소서.\n\n<strong>D : 절대 언약 - Dream(OO) - 미리 누림</strong>\n하나님이 주신 꿈인 세계복음화가 절대 언약이 되어 영원이라는 망대로 내게 세워지게 하옵소서. 그래서 미리 누리게 하옵소서.\n\n<strong>I : 절대 여정 - Image(능력) - 미리 정복</strong>\n하나님이 주신 창조의 영, 그 힘으로 절대 여정을 가게 하옵소서. 그래서 하나님이 주신 권세인 이미지의 망대로 공중 권세 잡은 자를 꺾고 미리 정복하게 하옵소서.\n\n<strong>P : 절대 목표 - Practice(보좌) - 미리 성취</strong>\n하나님의 절대 목표인 보좌의 능력으로 시대 살릴 작품을 만들게 하사 미리 성취를 누리게 하옵소서."
            },
            {
                title: "7망대(7): 세 가지 뜰",
                content: "<strong> 세 가지 뜰</strong>\n세 가지 뜰, 그 능력이 임하게 하옵소서.\n\n<strong>이방인의 뜰</strong>\n하나님, 확실한 성령의 인도부터 받길 원합니다. 그래서 오늘이 인생 전환점이 되게 하옵소서. 마가 다락방의 그 능력부터 체험하여 세계복음화의 결론을 보게 하옵소서. 그래서 내 안에, 내 업에, 교회와 현장에 이방인의 뜰이 서게 하옵소서. \n\n<strong>치유의 뜰</strong>\n내 안에, 그리고 교회와 내 업의 현장에 치유의 뜰, 기도의 뜰이 서게 하옵소서. 그래서 오직 예수 그리스도 그 이름으로 아무도 고칠 수 없는 병을 고치게 하옵소서.\n\n<strong>아이들의 뜰</strong>\n내 안에, 내 업과 교회와 현장에 아이들의 뜰이 서게 하옵소서. 아이들에게 그리스도의 당위성, 예배와 기도의 비밀, 하나님 나라가 진짜 응답임을 전달하게 하옵소서. 237, 치유, 서밋이 되게 하옵소서."
            },
            {
                title: "7여정(1): 성삼위 하나님의 인도",
                content: "<strong>여정</strong>\n하나님의 계획을 어디서든 발견하여 7여정이 뿌리내리게 하소서.\n\n<strong>성삼위 하나님의 인도</strong>\n내 안에 영으로 임하셔서 성삼위 하나님이 인도하시는 길로 가게 하옵소서.\n\n우리의 여정이 성부 하나님의 말씀 성취와 그리스도의 구원의 역사와 성령의 능력 속에 있게 하옵소서. 성삼위 하나님의 시간표 속에 있게 하셔서 영세 전에 감추어 둔 것과 지금 아니면 안되는 것과 영원히 있을 것에 쓰임 받게 하옵소서."
            },
            {
                title: "7여정(2): 10가지 비밀",
                content: "<strong>10가지 비밀</strong>\n나에게는 어려움이 너무 많습니다. 하나님이 준비해 놓은 그 길 찾기 위해 10가지 비밀 누리게 하옵소서. 그래서 무엇이든지 응답으로 바꾸는 여정을 가게 하옵소서.\n\n<strong>영적 독립</strong>\n기도로 성삼위 하나님과 보좌의 능력과 세계 살릴 힘을 얻게 하셔서 어떤 경우에도 혼자 살아남는 길을 가게 하옵소서.\n\n<strong>영적 사실</strong>\n세상 나라, 사탄의 나라, 하나님 나라를 알고 현실과 사실과 진실 속에서 다른 사람이 못 보는 영적 사실을 보게 하옵소서.\n\n<strong>반대편</strong>\n사람이 생각지도 않은 반대편에 하나님의 숨은 응답이 있음을 알고 나의 기준, 수준, 표준을 넘어 하나님의 것에 집중하게 하옵소서.\n\n<strong>시너지</strong>\nWith, Immanuel, Oneness를 가지고 가는 곳마다 많은 사람을 살리는 시너지가 일어나게 하옵소서.\n\n<strong>위기</strong>\n성삼위 하나님의 능력 아는 자는 위기 속으로 들어갑니다. 보조화 된 사람은 위기 속에 있는 축복을 봅니다. 성령 충만한 사람은 위기 속에서 사람 살리는 길을 찾습니다. 위기 속에 들어가서 하나님의 절대 계획을 찾아내 이기게 하옵소서.\n\n<strong>무경쟁</strong>\n하나님의 자녀 된 신분과 권세와 그 배경으로 영적인 힘과 참 응답을 받아 싸우지 않고 이기는 길을 가게 하옵소서.\n\n<strong>재창조</strong>\n어딜 가든지 숨겨져 있는 오직, 유일성, 재창조를 찾아내어 가장 필요한 것을 하는 사람으로 서게 하옵소서.\n\n<strong>서밋</strong>\n영적 서밋, 기능 서밋, 문화 서밋의 자리에 올라 환경과 현장을 살리고, 시대를 앞서가는 응답을 받게 하옵소서.\n\n<strong>Nobody, Nothing</strong>\n아무도 도와주지 않는 Nobody에서 모든 사람 살리는 Everybody로, 아무것도 없는 Nothing에서 모든 것을 살리는 Everything으로 가는 나의 길 되게 하옵서서.\n\n<strong>절대 응답</strong>\n어디서든지 절대 계획과 절대 이유를 찾아내어 절대 응답을 누리는 성공자가 되게 하옵소서."
            },
            {
                title: "7여정(3): 10가지 발판",
                content: "10가지 발판(구원, 말씀, 성령, 교회, 헌금, 기도, 전도, 시대, 삶, 세계) 위에 굳게 서게 하옵소서."
            },
            {
                title: "7여정(4): 5가지 확신",
                content: "구원, 기도응답, 승리, 사죄, 인도 확신을 주셔서 흔들리지 않게 하옵소서."
            },
            {
                title: "7여정(5): 9가지 흐름",
                content: "나(영), 나의 것(혼), 나의 현장(몸)의 3단계와 위(보좌), 아래(현장), 옆(237)의 흐름 속에서 응답을 보게 하옵소서."
            },
            {
                title: "7여정(6): 62가지 전도자의 삶",
                content: "예수 그리스도 안에서 62가지 전도자의 삶을 누리며 증인되게 하옵소서."
            },
            {
                title: "7여정(7): 보좌의 캠프",
                content: "보좌의 축복을 현장에 전달하는 캠프의 응답을 누리게 하옵소서."
            },
            {
                title: "7이정표(1): 갈보리산",
                content: "갈보리산에서 십자가로 모든 문제를 해결하신 그리스도만 오직 붙잡게 하옵소서."
            },
            {
                title: "7이정표(2): 감람산",
                content: "감람산에서 하나님의 나라를 40일 동안 설명하신 언약이 내게 성취되게 하옵소서."
            },
            {
                title: "7이정표(3): 마가 다락방",
                content: "마가 다락방에 임했던 성령의 역사가 내게 임하게 하사 증인되게 하옵소서."
            },
            {
                title: "7이정표(4): 안디옥",
                content: "안디옥교회처럼 중직자들과 렘넌트를 통해 세계 선교의 문이 열리게 하옵소서."
            },
            {
                title: "7이정표(5): 아시아",
                content: "하나님의 절대 주권 속에서 아시아 지역을 살리는 전도의 문이 열리게 하옵소서."
            },
            {
                title: "7이정표(6): 마게도냐",
                content: "바울처럼 마게도냐의 부름을 듣고 유럽을 살리는 중요한 이정표가 되게 하옵소서."
            },
            {
                title: "7이정표(7): 로마",
                content: "로마 복음화를 향한 하나님의 절대 목표를 보고 나의 삶을 드리게 하옵소서."
            },
        ];
        
        // ******************************************************
        // ** Firebase Persistence Logic **
        // ******************************************************

        // Firestore 문서 참조를 가져오는 함수
        function getPrayerDocRef(appId, userId) {
            const { doc } = window.firebaseImports;
            // Private data path: /artifacts/{appId}/users/{userId}/prayer_checks/user_status
            return doc(db, `artifacts/${appId}/users/${userId}/${COLLECTION_NAME}/${DOCUMENT_ID}`);
        }

        // Firestore에서 체크 상태를 실시간으로 로드하고 리스너를 설정
        function loadCheckStatus() {
            if (!db || !userId) return;

            const { onSnapshot } = window.firebaseImports;
            const loadingMessage = document.getElementById('loading-message');
            loadingMessage.textContent = '체크 상태 로드 중...';
            loadingMessage.classList.remove('hidden'); // 로딩 메시지 다시 표시

            // 실시간 리스너 설정
            onSnapshot(getPrayerDocRef(appId, userId), (docSnapshot) => {
                loadingMessage.classList.add('hidden'); // 로드 완료 후 메시지 숨김
                if (docSnapshot.exists()) {
                    const data = docSnapshot.data();
                    // checked_topics 객체 로드
                    checkedStatus = data.checked_topics || {};
                } else {
                    checkedStatus = {};
                }
                
                // 데이터 로드 후 UI 업데이트
                renderTopicList();
            }, (error) => {
                console.error("Firestore snapshot listener error:", error);
                loadingMessage.textContent = '데이터 로드 오류.';
                // 오류 발생 시에도 최소한 목록은 렌더링하여 '데이터 로드 중...' 메시지를 제거
                renderTopicList(); 
            });
        }

        // Firestore에 체크 상태를 저장
        function saveCheckStatus() {
            if (!db || !userId) {
                console.warn("Firestore not ready. Cannot save.");
                return;
            }

            const { setDoc } = window.firebaseImports;
            // setDoc을 사용하여 덮어쓰기 (merge: false)
            setDoc(getPrayerDocRef(appId, userId), { checked_topics: checkedStatus }, { merge: false })
                .then(() => console.log("Check status saved successfully."))
                .catch((error) => console.error("Error saving check status:", error));
        }

        /**
         * 주제 목록을 동적으로 생성하고 이벤트 리스너를 추가합니다.
         */
        function renderTopicList() {
            const topicListContainer = document.getElementById('topic-list');
            topicListContainer.innerHTML = ''; // 중복 렌더링 방지
            
            topics.forEach((topic, index) => {
                const isChecked = checkedStatus[index] === true;
                const button = document.createElement('button');
                
                // 버튼 스타일: 렌더링 버그를 피하기 위해 배경색 변경은 체크 상태에만 의존합니다.
                let classes = [
                    'topic-button', 'w-full', 'text-left', 'px-3', 'py-2', 'rounded-lg', 
                    'transition-all', 'duration-200', 'font-medium', 'text-gray-700', 
                    'hover:bg-gray-200', 'focus:outline-none', 'focus:ring-2', 'focus:ring-primary-blue/50'
                ];

                if (isChecked) {
                    // 체크된 항목은 연한 회색 배경과 파란색 텍스트로 표시
                    classes.push('bg-checked-gray', 'text-primary-blue'); 
                } else {
                    classes.push('bg-transparent', 'text-gray-700');
                }
                
                button.classList.add(...classes);
                button.setAttribute('data-index', index);
                
                // 체크 아이콘 (SVG)
                const checkIcon = isChecked 
                    ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-primary-blue mr-3 flex-shrink-0"><path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.532-1.258-1.258a.75.75 0 1 0-1.06 1.06l1.75 1.75a.75.75 0 0 0 1.137-.089l4-5.625Z" clip-rule="evenodd" /></svg>`
                    : `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-gray-400 mr-3 flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>`;
                
                button.innerHTML = checkIcon + `<span class="truncate">${topic.title}</span>`;
                
                // 클릭 시 내용 표시 및 체크 상태 토글
                button.addEventListener('click', () => selectTopic(index));
                topicListContainer.appendChild(button);
            });
        }

        /**
         * 특정 주제를 선택하고 콘텐츠 영역을 업데이트하며, 체크 상태를 토글합니다.
         * @param {number} index - 선택된 주제의 인덱스
         */
        function selectTopic(index) {
            if (index < 0 || index >= topics.length) return;

            const topic = topics[index];
            const formattedContent = topic.content.replace(/\n/g, '<br>');

            // 1. 콘텐츠 영역 업데이트
            const contentDisplay = document.getElementById('content-display');
            contentDisplay.innerHTML = `
                <h2 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-3" id="content-title">
                    ${topic.title}
                </h2>
                <div class="text-gray-700 leading-relaxed text-lg bg-secondary-gray p-6 rounded-xl shadow-inner">
                    <p class="mb-4 font-semibold text-primary-blue">기도 내용:</p>
                    <p>${formattedContent}</p>
                </div>
            `;

            // 2. 체크 상태 토글 및 저장
            // 현재 상태의 반대값으로 토글합니다.
            checkedStatus[index] = !(checkedStatus[index] === true);
            saveCheckStatus(); // Firestore에 저장 (onSnapshot이 UI를 업데이트합니다.)
            
            // 3. UI 인스턴트 업데이트 (onSnapshot 대기 시간을 줄이기 위해)
            const buttons = document.querySelectorAll('.topic-button');
            const selectedButton = buttons[index];
            if (selectedButton) {
                if (checkedStatus[index]) {
                    selectedButton.classList.add('bg-checked-gray', 'text-primary-blue');
                } else {
                    selectedButton.classList.remove('bg-checked-gray', 'text-primary-blue');
                }
                // 아이콘도 즉시 업데이트
                const isChecked = checkedStatus[index] === true;
                const checkIcon = isChecked 
                    ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-primary-blue mr-3 flex-shrink-0"><path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.532-1.258-1.258a.75.75 0 1 0-1.06 1.06l1.75 1.75a.75.75 0 0 0 1.137-.089l4-5.625Z" clip-rule="evenodd" /></svg>`
                    : `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-gray-400 mr-3 flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>`;
                
                selectedButton.innerHTML = checkIcon + `<span class="truncate">${topic.title}</span>`;
            }
            
            // onSnapshot이 결국 renderTopicList()를 호출하여 전체 목록을 동기화합니다.
        }

        /**
         * 암호를 확인하고 Firebase 인증 및 데이터 로드를 시작하는 함수
         */
        async function checkPassword() {
            const input = document.getElementById('password-input');
            const errorMsg = document.getElementById('error-message');
            const passwordScreen = document.getElementById('password-screen');
            const mainContent = document.getElementById('main-content');
            const userIdDisplay = document.getElementById('user-id-display');
            const loadingMessage = document.getElementById('loading-message');
            
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, setLogLevel } = window.firebaseImports;

            if (input.value === SECRET_PASSWORD) {
                // 성공: UI 전환
                passwordScreen.classList.add('opacity-0');
                setTimeout(() => {
                    passwordScreen.style.display = 'none';
                    mainContent.classList.remove('opacity-0');
                }, 500);

                errorMsg.classList.add('hidden');
                loadingMessage.classList.remove('hidden');

                // Firebase 설정
                appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                const firebaseConfig = JSON.parse(__firebase_config);
                const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                setLogLevel('debug'); // 콘솔 디버깅 활성화

                try {
                    // 1. 인증 시도
                    if (initialAuthToken) {
                        await signInWithCustomToken(auth, initialAuthToken);
                    } else {
                        await signInAnonymously(auth);
                    }
                    
                    userId = auth.currentUser?.uid;
                    userIdDisplay.textContent = `사용자 ID: ${userId || 'N/A'}`;
                    
                    // FIX: 목록을 즉시 렌더링하여 '데이터 로드 중...' 메시지를 제거하고 기본 목록을 표시합니다.
                    renderTopicList(); 

                    // 2. 인증 성공 후 데이터 로드 시작 (checkedStatus는 onSnapshot이 채워줌)
                    loadCheckStatus();

                } catch (error) {
                    console.error("Firebase 인증 실패:", error);
                    userId = crypto.randomUUID(); // 인증 실패 시 임시 ID 사용
                    userIdDisplay.textContent = `사용자 ID: (인증 오류) ${userId.substring(0, 8)}...`;
                    loadingMessage.textContent = '인증 실패. 임시 모드로 시작합니다.';
                    renderTopicList(); // 데이터 로드 없이 목록만 표시
                }

            } else {
                // 실패: 에러 메시지 표시
                errorMsg.classList.remove('hidden');
                input.value = '';
                input.focus();
            }
        }

        // 페이지 로드 시 이벤트 리스너 설정
        window.onload = function() {
            if (!window.firebaseImports) {
                const topicListContainer = document.getElementById('topic-list');
                topicListContainer.innerHTML = '<div class="text-red-500 mt-4">Firebase 로드 중 오류 발생. 새로고침 해주세요.</div>';
                return;
            }

            const submitButton = document.getElementById('submit-password');
            const passwordInput = document.getElementById('password-input');

            // 버튼 클릭 시 암호 확인
            submitButton.addEventListener('click', checkPassword);
            
            // Enter 키 입력 시 암호 확인
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    checkPassword();
                }
            });
        };

    </script>
