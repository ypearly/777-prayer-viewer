            {
                // **HTML <strong> 태그를 사용하여 굵은 글씨 효과를 추가했습니다.**
                title: "7망대(1): 성삼위 하나님",
                content: "<strong>7망대</strong>\n어디서든 하나님과 소통되는 기도의 사람 되도록 7망대가 각인되게 하옵소서.\n\n<strong>성삼위 하나님</strong>\n성삼위 하나님께서 내 안에 역사해 주옵소서. 내 생각, 마음 영혼, 몸 모든 것을 사로잡아 주옵소서.\n\n<strong>성부 하나님</strong>\n성부 하나님이 말씀으로 내 안에 역사해 주옵소서. 하나님의 말씀이 내 안에 잘 박힌 못처럼 박히게 하사 내 생각, 마음, 영혼, 몸에 창조의 역사가 일어나게 해 주옵소서.\n\n<strong>성자 예수님</strong>\n성자 예수님이 구원으로 내 안에 역사해 주옵소서. 나의 과거 문제를 해결하신 영세 전 그리스도, 사탄·재앙·지옥 배경에서 나를 건지신 성육신 그리스도, 나와 함께하시는 부활하신 그리스도, 나의 미래를 책임지시고 배경 되시는 재림 주, 심판 주 그리스도께서 나의 주인이 되어 주옵소서.\n\n<strong>성령 하나님</strong>\n성령 하나님이 능력으로 내 안에 역사해 주옵소서. 지금도 성령께서 내 안에 계시고 나를 인도하시니 감사합니다. 성령께서 나에게 충만하게 역사하사 그리스도가 구체화 되고 하나님의 나라가 임하며 땅끝까지 증인 되게 하옵소서."
            },
            {
                title: "7망대(2): 보좌의 능력",
                content: "<strong>보좌의 능력</strong>\n보좌의 능력이 내 속에 임하게 하옵소서. 하나님 나라, 이루어지게 하옵소서. 시공간 초월과 237의 능력이 내 속에 임하게 하옵소서. 내 생명 속에 이 능력이 임하게 하옵소서. 내 영혼 속에 임하게 하옵소서. 내 삶 속에 임하게 하옵소서. 전무후무한 답을 나에게, 내 학업에, 내현장에, 교회에 주시옵소서.\n\n<strong>3초월 : 보좌, 시공간 초월, 237</strong>\n성삼위 하나님, 나를 보좌 삼으시고 내 속에 살고 계시니 감사합니다. 나, 교회, 현장에 보좌의 능력으로 지금 역사해 주옵소서. 시공간을 초월하여 말씀을 이루는 하늘 군대가 동원되고 흑암이 무너지며 하나님의 나라, 이루어지게 하옵소서. 지금 237 나라에 빛으로 임재하옵소서.\n\n<strong>3생명 : 하나님의 형상, 생기, 에덴의 축복</strong>\n그리스도께서 빛으로 내 생명 속에 오셔서 하나님의 형상을 회복시켜 주시니 감사합니다. 내 영혼 속에 하나님의 생기를 부어 주옵소서. 나의 삶 속에 에덴의 축복이 임하게 하옵소서. 가정과 세상을 살리고 다스리며 정복하는 힘을 나에게 주옵소서.\n\n<strong>3전무후무 : 나, 교회, 업</strong>\n나를 전무후무한 존재로 만드시고, 나에게 전무후무한 계획을 준비해 놓으신 하나님께 감사드립니다. 하나님이 나에게만 주신 전무후무한 응답을 누리게 하옵소서. 교회에서 만나는 사람들과 일 속에서 전무후무한 응답을 보게 하옵소서. 내가 꼭 해야 되는 일, 이면계약이 보이게 하옵소서. 하나님이 만드신 나, 나의 것, 나의 현장을 찾게 하셔서 오직, 유일성, 재창조의 응답을 받게 하옵소서. 나의 업이 사람 살리는 플랫폼, 파수 망대, 안테나가 되게 하옵소서."

            {

                content: "<strong>3시대 살릴 능력</strong>\n하나님이 나의 과거, 현재, 미래 속에 능력으로 역사해 주옵소서.\n\n<strong>나의 3시대 살릴 능력 : 과거, 오늘, 미래</strong>\n나의 과거는 완전히 발판이 되게 하옵소서. 오늘 나의 문제는 간증 거리로 바뀌게 하옵소서. 오늘의 문제 속에 답을, 갈등 속에 갱신의 축복을, 위기 속에 기회를 찾게 하옵소서. 나의 미래는 미리 하나님의 응답과 길을 보고 가게 하옵소서.\n\n<strong>업의 3시대 살릴 능력 : 전문화, 제자화, 세계화</strong>\n하나님! 나의 업이 오직, 유일성, 재창조로 전문화되도록 능력을 부어 주옵소서. 나의 업을 가지고 제자들을 세울 만틈 제자화의 응답을 주옵소서. 237과 5천 종족을 살리는 세계화의 능력을 주옵소서.\n\n<strong>교회의 3시대 살릴 능력 : 목회자, 중직자, 렘넌트와 부교역자</strong>\n목회자 도울 능력을 내게 주셔서 교회가 살아나게 하옵소서. 중직자 살릴 능력을 내게 주셔서 현장이 살아나게 하옵소서. 렘넌트와 부교역자 살릴 능력을 내게 주셔서 세계와 미래가 살아나게 하옵소서."
            },
            {
                title: "7망대(4) : 5력",
                content: "<strong>5력</strong>\n이 시간에 하나님이 나에게 5력을 주시옵소서\n\n<strong>영력</strong>\n세상 사람들이 알 수 없는 눈에 안 보이는 영적임 힘을 내게 주옵소서.\n\n<strong>지력</strong>\n하나님이 주시는 사람 살리는 지력을 내게 주옵소서.\n\n<strong>체력</strong>\n하나님의 일을 할 수 있고 불신자 앞에서 간증할 수 있을 정도의 체력을 내게 주옵소서.\n\n<strong>경제력</strong>\n전 세계에 RUTC세울 수 있도록 빛의 경제 회복하는 경제력을 내게 주시옵소서. \n\n<strong>인력</strong>\n237나라, 5천 종족 살릴 1천만 제자 움직이는 인력을 내게 주옵소서."
            },
            {
                title: "7망대(5): 우주의 능력",
                content: "<strong>우주의 능력</strong>\n나에게 시공간 초월하는, 공중 권세 잡은 자 이기는 능력을 주옵소서.\n\n흑암 세계, 공중 권세 잡은 자를 꺾을 수 있는 예수 그리스도의 이름을 주시니 감사합니다. 공중 권세 잡은 자를 이길 수 있는 우주의 능력이 지금 내 속에 임하게 하옵소서. Heavely Power, Thronely Power, Eternaly Power로 충만케 하옵소서."
            },
            {
                title: "7망대(6): 미리 CVDIP",
                content: "<strong>미리 CVDIP</strong>\n나에게 미리 보는 CVDIP 축복을 지금 허락해 주옵소서.\n\n<strong>C : 절대주권 - Covenant(24) - 미리보기</strong>\n하나님, 하나님의 절대 주권을 믿는 믿음을 주셔서 그 속에서 언약 붙잡게 하옵소서. 그 언약이 24 내 속에 망대로 서게 하셔서 응답을 미리 보고 가게 하옵소서."
            },
            {
                title: "7망대(7): 세 가지 뜰",
                content: "...."

            {

                content: "....."

                content: "......"

            {

                content: "......"
            },
        ];

        let activeTopicIndex = -1; // 현재 선택된 주제 인덱스

        /**
         * 주제 목록을 동적으로 생성하고 이벤트 리스너를 추가합니다.
         */
        function renderTopicList() {
            const topicListContainer = document.getElementById('topic-list');
            topicListContainer.innerHTML = ''; // 중복 렌더링 방지
            topics.forEach((topic, index) => {
                const button = document.createElement('button');
                button.classList.add(
                    'topic-button', // 이벤트 핸들링을 위한 클래스
                    'w-full', 'text-left', 'px-3', 'py-2', 'rounded-lg', 'transition-all',
                    'duration-200', 'font-medium', 'text-gray-700', 'hover:bg-primary-blue/10',
                    'hover:text-primary-blue', 'focus:outline-none', 'focus:ring-2', 'focus:ring-primary-blue/50'
                );
                button.textContent = topic.title;
                button.setAttribute('data-index', index);
                button.addEventListener('click', () => selectTopic(index));
                topicListContainer.appendChild(button);
            });

            // 페이지 로드 시 첫 번째 주제를 자동으로 선택
            if (topics.length > 0) {
                selectTopic(0);
            }
        }

        /**
         * 특정 주제를 선택하고 콘텐츠 영역을 업데이트합니다.
         * @param {number} index - 선택된 주제의 인덱스
         */
        function selectTopic(index) {
            // 인덱스 유효성 검사
            if (index < 0 || index >= topics.length) {
                console.error("유효하지 않은 주제 인덱스입니다.");
                return;
            }

            const topic = topics[index];
            
            // 핵심 수정 부분: \n (줄 바꿈 문자)를 <br> 태그로 변환합니다.
            const formattedContent = topic.content.replace(/\n/g, '<br>');

            // 1. 콘텐츠 영역 업데이트
            const contentDisplay = document.getElementById('content-display');
            contentDisplay.innerHTML = `
                <h2 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-3" id="content-title">
                    ${topic.title}
                </h2>
                <div class="text-gray-700 leading-relaxed text-lg bg-secondary-gray p-6 rounded-xl shadow-inner">
                    <p class="mb-4 font-semibold text-primary-blue">기도 내용:</p>
                    <p>${formattedContent}</p>
                </div>
            `;

            // 2. 버튼 활성화/비활성화 상태 업데이트
            const buttons = document.querySelectorAll('.topic-button');
            
            // 이전 활성화 버튼 스타일 제거
            if (activeTopicIndex !== -1 && activeTopicIndex < buttons.length) {
                // 이전 버튼에서 z-index 및 position 스타일 제거
                buttons[activeTopicIndex].classList.remove('bg-primary-blue', 'text-white', 'shadow-md', 'relative', 'z-10'); 
                buttons[activeTopicIndex].classList.add('bg-transparent', 'text-gray-700');
            }

            // 새 활성화 버튼 스타일 적용
            const selectedButton = buttons[index];
            if (selectedButton) {
                // 현재 버튼에 z-index 및 position 스타일 추가 (모바일 렌더링 문제 해결을 위한 z-index 유지)
                selectedButton.classList.add('bg-primary-blue', 'text-white', 'shadow-md', 'relative', 'z-10');
                selectedButton.classList.remove('bg-transparent', 'text-gray-700', 'hover:bg-primary-blue/10');
            }
            
            activeTopicIndex = index; // 현재 활성화된 인덱스 업데이트
        }

        /**
         * 암호를 확인하고 메인 콘텐츠를 표시하는 함수
         */
        function checkPassword() {
            const input = document.getElementById('password-input');
            const errorMsg = document.getElementById('error-message');
            const passwordScreen = document.getElementById('password-screen');
            const mainContent = document.getElementById('main-content');

            if (input.value === SECRET_PASSWORD) {
                // 성공: 암호 화면 숨기기 및 메인 콘텐츠 표시
                passwordScreen.classList.add('opacity-0');
                // 애니메이션이 끝난 후 display: none 처리
                setTimeout(() => {
                    passwordScreen.style.display = 'none';
                }, 500);

                mainContent.classList.remove('opacity-0');
                mainContent.classList.add('opacity-100');
                errorMsg.classList.add('hidden');
                
                // 인증 후 주제 목록 렌더링 시작
                renderTopicList();

            } else {
                // 실패: 에러 메시지 표시
                errorMsg.classList.remove('hidden');
                input.value = ''; // 입력 필드 초기화
                input.focus();
            }
        }

        // 페이지 로드 시 이벤트 리스너 설정
        window.onload = function() {
            const submitButton = document.getElementById('submit-password');
            const passwordInput = document.getElementById('password-input');

            // 버튼 클릭 시 암호 확인
            submitButton.addEventListener('click', checkPassword);
            
            // Enter 키 입력 시 암호 확인
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault(); // 기본 Enter 동작(폼 제출) 방지
                    checkPassword();
                }
            });
        };

    </script>
</body>
</html>
